name: API

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: chat-test-jb-api

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build backend/ChatApp.slnx -c Release

      - name: Test
        run: dotnet test backend/ChatApp.slnx -c Release --no-build

      - name: Publish
        run: dotnet publish backend/src/ChatApp.Api/ChatApp.Api.csproj -c Release --no-build -o ${{ github.workspace }}/publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ github.workspace }}/publish

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC login
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish
