name: Web

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/chat-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/chat-app/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/chat-app/dist/chat-app/browser
          skip_app_build: true
          api_location: ''
